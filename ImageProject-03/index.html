
<!DOCTYPE html>
<html>
<head>
  <title>Exploring an Alien Planet</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
</head>

<body>
<a-scene background="color: #24133F">

  <!-- Custom sky image -->
  <a-sky src="assets/alien-sky.jpg"></a-sky>

  <!-- Alien planet ground -->
  <a-plane
    position="0 0 0"
    rotation="-90 0 0"
    width="100"
    height="100"
    color="#675078">
  </a-plane>

  <!-- Spaceship downloaded 3D model -->
  <a-entity
    gltf-model="url(assets/scene.gltf)"
    position="-4 1 -8"
    rotation="0 45 0"
    scale="1 1 1">
  </a-entity>

  
  <!-- Alien downloaded 3D model -->
  <a-entity
    gltf-model="url(assets/alien/scene.gltf)"
    position="3 0 -6"
    rotation="0 30 0"
    scale="0.005 0.005 0.005">
  </a-entity>


  <!-- Alien rocks -->
  <a-dodecahedron
    position="-2 0.7 -4"
    radius="1"
    color="#58446B">
  </a-dodecahedron>

  <a-dodecahedron
    position="5 0.5 -9"
    radius="1.5"
    color="#40334F">
  </a-dodecahedron>

  <!-- Glowing planet -->
  <a-sphere
    position="10 15 -25"
    radius="5"
    color="#A35BFF"
    material="emissive: #552299; emissiveIntensity: 0.5">
  </a-sphere>

  <!-- Stars -->
  <a-sphere position="-12 12 -20" radius="0.2" color="white"></a-sphere>
  <a-sphere position="8 18 -15" radius="0.15" color="white"></a-sphere>
  <a-sphere position="-8 20 -30" radius="0.2" color="white"></a-sphere>

  <!-- Lighting -->
  <a-light type="ambient" intensity="1.2" color="#BBB0FF"></a-light>
  <a-light type="directional" position="5 10 5" intensity="1"></a-light>

  <!-- Player camera -->
  <a-entity position="0 0 5">
    <a-camera wasd-controls look-controls></a-camera>
  </a-entity>

</a-scene>
</body>
</html>
